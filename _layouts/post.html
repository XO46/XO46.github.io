---
layout: default
---

<style>
/* ===== GLOBAL POST THEME ===== */
body {
  background: #0a0a0a !important;
  color: #c9ffd6 !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* ===== REMOVE EXTRA TOP SPACE ===== */
.page-content {
  padding-top: 0 !important;
  margin-top: 0 !important;
}

.wrapper {
  padding-top: 0 !important;
}

/* ===== POST CONTENT BOX ===== */
.post-content {
  max-width: 1150px;
  margin: 40px auto;
  background: #0d0d0d;
  padding: 40px;
  border: 2px solid #00ff00;
  box-shadow: 0 0 25px rgba(0,255,0,0.25);
}

/* ===== TYPOGRAPHY ===== */
.post-content h1 {
  color: #00ff00;
  font-size: 2.1rem;
  margin-bottom: 10px;
}

.post-content h2 {
  color: #00ff00;
  font-size: 1.6rem;
  margin-top: 35px;
  margin-bottom: 12px;
}

.post-content h3 {
  color: #7CFF7C;
  font-size: 1.25rem;
  margin-top: 25px;
}

.post-content p,
.post-content li {
  font-size: 1rem;
  line-height: 1.65;
  color: #c9ffd6;
}

/* ===== LINKS ===== */
.post-content a {
  color: #00ccff;
  text-decoration: none;
}

.post-content a:hover {
  color: #00ff00;
  text-decoration: underline;
}

/* ===== CODE BLOCKS ===== */
pre {
  background: #000 !important;
  color: #00ff00 !important;
  padding: 16px;
  border: 1px solid #333;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.95rem;
}

code {
  background: #000 !important;
  color: #00ff00 !important;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.95rem;
}
</style>

<div class="post-content">
  {{ content }}
</div>
