---
layout: default
---

<style>
/* ===== GLOBAL POST THEME ===== */
body {
  background: #0a0a0a !important;
  color: #c9ffd6 !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* ===== REMOVE EXTRA TOP SPACE ===== */
.page-content {
  padding-top: 0 !important;
  margin-top: 0 !important;
}

.wrapper {
  padding-top: 0 !important;
}

/* ===== POST CONTENT BOX ===== */
.post-content {
  max-width: 1150px;
  margin: 40px auto;
  background: #0d0d0d;
  padding: 40px;
  border: 2px solid #00ff00;
  box-shadow: 0 0 25px rgba(0,255,0,0.25);
}

/* ===== TYPOGRAPHY (POSTS) ===== */
.post-content h1 {
  font-size: 2.4rem;
  margin-bottom: 14px;
}

.post-content h2 {
  font-size: 1.75rem;
  margin-top: 45px;
  margin-bottom: 14px;
}

.post-content h3 {
  font-size: 1.35rem;
  margin-top: 30px;
}

.post-content p,
.post-content li {
  font-size: 1.1rem;
  line-height: 1.75;
}

/* ===== CODE BLOCKS ===== */
pre {
  background: #000 !important;
  color: #00ff00 !important;
  padding: 16px;
  border: 1px solid #333;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.95rem;
}

code {
  background: #000 !important;
  color: #00ff00 !important;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.95rem;
}
</style>

<div class="post-content">

  <!-- Post Title -->
  <h1>{{ page.title }}</h1>

  <!-- oxdf-style intro (auto) -->
  {% if page.summary %}
    {% include oxdf-intro.html %}
  {% endif %}

  <!-- Actual writeup content -->
  {{ content }}

</div>
