---
layout: default
---

<style>
/* ===== TERMINAL (OXDF / UBUNTU) ===== */
.terminal {
  margin: 16px 0 24px 0;
}

.terminal pre {
  background: #300a24;
  color: #eeeeec;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid #1f0015;
  overflow-x: auto;
  font-family: "Ubuntu Mono", "DejaVu Sans Mono", monospace;
  font-size: 0.95rem;
  line-height: 1.4;
}

.terminal .prompt {
  color: #8ae234;
  font-weight: 600;
}

.terminal .cmd {
  color: #eeeeec;
}

.terminal .out {
  color: #eeeeec;
}
/* ===== HARD DARK OVERRIDE (STOP MINIMA) ===== */

html, body {
  background: #0a0a0a !important;
  color: #c9ffd6 !important;
}

.page-content,
.wrapper,
.site,
.site-content,
main {
  background: transparent !important;
}
</style>

<div class="post-content">

  <h1>{{ page.title }}</h1>

  {% if page.summary %}
    {% include oxdf-intro.html %}
  {% endif %}

  {{ content }}

</div>
