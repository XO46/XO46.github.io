<style>
/* ================================
   FINAL LOCKED TERMINAL STYLE
   ================================ */

.terminal {
  margin: 16px 0 24px 0;
}

.terminal pre {
  background: #300a24 !important;   /* Ubuntu purple */
  color: #eeeeec !important;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid #1f0015;
  overflow-x: auto;
  max-height: 420px;
  font-size: 0.95rem;
  line-height: 1.4;
  font-family: "Ubuntu Mono", "DejaVu Sans Mono", monospace;
}

/* prompt */
.terminal .prompt {
  color: #8ae234 !important;
  font-weight: 600;
}

/* command */
.terminal .cmd {
  color: #eeeeec !important;
}

/* output */
.terminal .out {
  color: #eeeeec !important;
}
</style>

<div class="post-content">

  <h1>{{ page.title }}</h1>

  {% if page.summary %}
    {% include oxdf-intro.html %}
  {% endif %}

  {{ content }}

</div>
