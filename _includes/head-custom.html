<!-- Dark theme -->
<link rel="stylesheet" href="{{ '/assets/css/dark.css' | relative_url }}">

<!-- LinkedIn / Open Graph -->
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.summary | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">

{% if page.thumbnail %}
<meta property="og:image" content="{{ page.thumbnail | absolute_url }}">
{% endif %}
